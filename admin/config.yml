backend:
  name: github
  repo: Dear-Manuel/portfolio-manuel-sebastiao
  branch: main

# Onde ficam as imagens/vídeos que carregar no painel
media_folder: "uploads"
public_folder: "/uploads"

# Interface em português
locale: "pt"

collections:

  # ============================================
  # PROJETOS — o que aparece na secção "Projetos"
  # ============================================
  - name: "projects"
    label: "Projetos"
    files:
      - file: "content/projects.json"
        label: "Lista de Projetos"
        name: "projects"
        fields:
          - label: "Projetos"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Título do projeto", name: "title", widget: "string" }
              - label: "Área principal"
                name: "category"
                widget: "select"
                options:
                  - { label: "Contabilidade & Finanças", value: "contabilidade" }
                  - { label: "Informática & Tecnologia", value: "informatica" }
                  - { label: "Análise de Dados & BI", value: "dados" }
                hint: "Usado para agrupar o projeto na página de Projetos."
              - { label: "Etiqueta (ex: Contabilidade + Dados + BI)", name: "tag", widget: "string", required: false, hint: "Texto livre, mostrado como subtítulo do projeto." }
              - { label: "Mostrar em destaque na página inicial?", name: "featured", widget: "boolean", default: false, hint: "Máximo recomendado: 6 projetos em destaque." }
              - { label: "Descrição", name: "description", widget: "markdown", required: false, hint: "Pode ser tão extensa quanto precisar." }
              - { label: "Imagem de capa", name: "image", widget: "image", required: false }
              - { label: "Vídeo (link do YouTube/Vimeo ou ficheiro)", name: "video", widget: "string", required: false }
              - { label: "Link do projeto (site, repositório, ficheiro)", name: "link", widget: "string", required: false }
              - label: "Etapas do processo (opcional)"
                name: "flow"
                widget: "list"
                required: false
                field: { label: "Etapa", name: "step", widget: "string" }
              - label: "Ferramentas usadas"
                name: "tools"
                widget: "list"
                required: false
                field: { label: "Ferramenta", name: "tool", widget: "string" }

  # ============================================
  # PUBLICAÇÕES — carrossel de imagens temáticas na Home
  # ============================================
  - name: "publications"
    label: "Publicações"
    files:
      - file: "content/publications.json"
        label: "Carrossel de Publicações"
        name: "publications"
        fields:
          - label: "Publicações"
            name: "items"
            widget: "list"
            summary: "{{theme}}"
            fields:
              - { label: "Tema", name: "theme", widget: "string" }
              - { label: "Imagem", name: "image", widget: "image" }
              - { label: "Frase curta", name: "text", widget: "text", hint: "Uma frase curta ou pensamento sobre o tema. Não é uma descrição longa." }

  # ============================================
  # PERFIL — nome, sobre mim, competências, formação
  # ============================================
  - name: "profile"
    label: "Perfil do site"
    files:
      - file: "data.json"
        label: "Dados do perfil"
        name: "profile_data"
        fields:
          - label: "Perfil"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "Fotografia", name: "photo", widget: "image", required: false }
              - { label: "Iniciais (para o logo)", name: "initials", widget: "string" }
              - { label: "Frase de posicionamento", name: "tagline", widget: "string" }
              - { label: "Localização", name: "location", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "LinkedIn (link completo)", name: "linkedin", widget: "string", required: false }
              - { label: "GitHub (link completo)", name: "github", widget: "string", required: false }
              - { label: "Frase de destaque (abaixo do nome)", name: "heroStatement", widget: "text" }
              - label: "Parágrafos do Sobre Mim"
                name: "aboutParagraphs"
                widget: "list"
                field: { label: "Parágrafo", name: "paragraph", widget: "text" }
          - label: "Números em destaque (hero)"
            name: "stats"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "Valor", name: "value", widget: "string" }
              - { label: "Legenda", name: "label", widget: "string" }
          - label: "Competências"
            name: "skills"
            widget: "list"
            summary: "{{category}}"
            fields:
              - { label: "Categoria", name: "category", widget: "string" }
              - { label: "Nota", name: "note", widget: "string", required: false }
              - label: "Itens"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Formação"
            name: "education"
            widget: "list"
            summary: "{{degree}}"
            fields:
              - { label: "Curso/Grau", name: "degree", widget: "string" }
              - { label: "Instituição", name: "institution", widget: "string" }
              - { label: "Período", name: "period", widget: "string" }
              - { label: "Nota", name: "note", widget: "string", required: false }
